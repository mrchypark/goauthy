apiVersion: v1
kind: Service
metadata:
  name: versity
  namespace: goauthy
  labels:
    app.kubernetes.io/name: versity
spec:
  selector:
    app.kubernetes.io/name: versity
  ports:
    - name: api
      port: 9000
      targetPort: api
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: versity
  namespace: goauthy
  labels:
    app.kubernetes.io/name: versity
spec:
  serviceName: versity
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: versity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: versity
    spec:
      serviceAccountName: goauthy
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: versity
          image: versity/versitygw:v1.8.0
          args: ["--port", ":9000", "posix", "/data"]
          env:
            - name: ROOT_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: goauthy-secrets
                  key: versity-root-user
            - name: ROOT_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: goauthy-secrets
                  key: versity-root-password
            - name: VGW_HEALTH
              value: /_/health
          ports:
            - name: api
              containerPort: 9000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /_/health
              port: api
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /_/health
              port: api
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /_/health
              port: api
            periodSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
