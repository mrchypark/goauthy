apiVersion: v1
kind: Service
metadata:
  name: goauthy-smtp-sink
  namespace: goauthy
  labels:
    app.kubernetes.io/name: goauthy-smtp-sink
    app.kubernetes.io/component: e2e-test-sink
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: goauthy-smtp-sink
  ports:
    - name: smtp
      protocol: TCP
      port: 1025
      targetPort: smtp
    - name: http
      protocol: TCP
      port: 8082
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goauthy-smtp-sink
  namespace: goauthy
  labels:
    app.kubernetes.io/name: goauthy-smtp-sink
    app.kubernetes.io/component: e2e-test-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: goauthy-smtp-sink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goauthy-smtp-sink
        app.kubernetes.io/component: e2e-test-sink
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sink
          image: goauthy-smtp-sink:e2e
          imagePullPolicy: Never
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8082
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: goauthy-smtp-sink
  namespace: goauthy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: goauthy-smtp-sink
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: goauthy
      ports:
        - protocol: TCP
          port: 1025
  egress: []
