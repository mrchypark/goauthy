apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: goauthy-smtp-sink-egress
  namespace: goauthy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: goauthy
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: goauthy-smtp-sink
      ports:
        - protocol: TCP
          port: 1025
