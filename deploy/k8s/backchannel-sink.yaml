apiVersion: v1
kind: Service
metadata:
  name: goauthy-backchannel-sink
  namespace: goauthy
  labels:
    app.kubernetes.io/name: goauthy-backchannel-sink
    app.kubernetes.io/component: e2e-test-sink
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: goauthy-backchannel-sink
  ports:
    - name: http
      protocol: TCP
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goauthy-backchannel-sink
  namespace: goauthy
  labels:
    app.kubernetes.io/name: goauthy-backchannel-sink
    app.kubernetes.io/component: e2e-test-sink
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: goauthy-backchannel-sink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goauthy-backchannel-sink
        app.kubernetes.io/component: e2e-test-sink
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sink
          image: goauthy-backchannel-sink:e2e
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: FAIL_FIRST
              value: "1"
            - name: TLS_CERT_FILE
              valueFrom:
                configMapKeyRef:
                  name: goauthy-backchannel
                  key: tls-cert-file
                  optional: true
            - name: TLS_KEY_FILE
              valueFrom:
                configMapKeyRef:
                  name: goauthy-backchannel
                  key: tls-key-file
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: tls
              mountPath: /run/backchannel-tls
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
      volumes:
        - name: tls
          secret:
            secretName: goauthy-backchannel-sink-tls
            optional: true
            defaultMode: 288
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: goauthy-backchannel-sink
  namespace: goauthy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: goauthy-backchannel-sink
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: goauthy
      ports:
        - protocol: TCP
          port: 8081
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: goauthy-backchannel-sink-egress
  namespace: goauthy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: goauthy
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: goauthy-backchannel-sink
      ports:
        - protocol: TCP
          port: 8081
