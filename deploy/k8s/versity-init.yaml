apiVersion: batch/v1
kind: Job
metadata:
  name: versity-init
  namespace: goauthy
spec:
  backoffLimit: 12
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/component: object-store-client
    spec:
      restartPolicy: OnFailure
      serviceAccountName: goauthy
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: curlimages/curl:8.16.0
          command:
            - /bin/sh
            - -ec
          args:
            - >-
              until curl -fsSI --aws-sigv4 aws:amz:us-east-1:s3
              --user "$VERSITY_ROOT_USER:$VERSITY_ROOT_PASSWORD" http://versity:9000/rhiza >/dev/null 2>&1 ||
              curl -fsS -X PUT --aws-sigv4 aws:amz:us-east-1:s3
              --user "$VERSITY_ROOT_USER:$VERSITY_ROOT_PASSWORD" http://versity:9000/rhiza >/dev/null 2>&1;
              do sleep 2; done
          env:
            - name: VERSITY_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: goauthy-secrets
                  key: versity-root-user
            - name: VERSITY_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: goauthy-secrets
                  key: versity-root-password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
