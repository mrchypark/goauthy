apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: goauthy
  namespace: goauthy
spec:
  template:
    spec:
      containers:
        - name: goauthy
          env:
            - name: GOAUTHY_DCR_ALLOWED_SCOPES
              value: "openid goauthy.read e2e-employee"
            - name: GOAUTHY_BOOTSTRAP_USER_ROLES
              value: '["e2e-claim-role"]'
            - name: GOAUTHY_BOOTSTRAP_USER_GROUPS
              value: '["e2e-claim-group"]'
