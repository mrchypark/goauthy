apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ternal-goauthy
  namespace: ternal-auth
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: goauthy
          ports:
            - $patch: replace
            - name: http
              containerPort: 8080
          env:
            - name: GOAUTHY_RHIZA_PROFILE
              value: standalone
            - name: GOAUTHY_RHIZA_OBJECT_STORE_PROVIDER
              value: gcs
            - name: GOAUTHY_RHIZA_OBJECT_STORE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: ternal-goauthy-config
                  key: object-store-bucket
            - name: GOAUTHY_RHIZA_OBJECT_STORE_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: ternal-goauthy-config
                  key: object-store-prefix
            - $patch: delete
              name: GOAUTHY_RHIZA_PEER_ADDR
            - $patch: delete
              name: GOAUTHY_RHIZA_MEMBERS
            - $patch: delete
              name: GOAUTHY_RHIZA_ADMIN_TOKEN
            - $patch: delete
              name: GOAUTHY_RHIZA_OBJECT_STORE_ENDPOINT
            - $patch: delete
              name: GOAUTHY_RHIZA_OBJECT_STORE_REGION
            - $patch: delete
              name: GOAUTHY_RHIZA_OBJECT_STORE_ACCESS_KEY
            - $patch: delete
              name: GOAUTHY_RHIZA_OBJECT_STORE_SECRET_KEY
