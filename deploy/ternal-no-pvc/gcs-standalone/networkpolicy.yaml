apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ternal-goauthy-gcs-standalone
  namespace: ternal-auth
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: goauthy
      app.kubernetes.io/part-of: ternal
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
