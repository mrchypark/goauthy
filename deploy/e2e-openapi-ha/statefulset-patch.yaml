apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: goauthy
  namespace: goauthy
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: goauthy
          env:
            - name: GOAUTHY_ISSUER
              value: http://127.0.0.1:18080
            - name: GOAUTHY_BOOTSTRAP_USER
              value: admin
            - name: GOAUTHY_BOOTSTRAP_FORCE_MFA
              value: "false"
            - name: GOAUTHY_BOOTSTRAP_USER_SUBJECT
              value: bootstrap-admin
            - name: GOAUTHY_BOOTSTRAP_USER_ROLES
              value: '["rauthy_admin"]'
            - name: GOAUTHY_SWAGGER_UI_ENABLE
              value: "true"
            - name: GOAUTHY_SWAGGER_UI_PUBLIC
              value: "false"
