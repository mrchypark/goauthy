apiVersion: v1
kind: Service
metadata:
  name: upstream-fixture
  namespace: goauthy
  labels:
    app.kubernetes.io/name: upstream-fixture
spec:
  selector:
    app.kubernetes.io/name: upstream-fixture
  ports:
    - name: https
      port: 443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: upstream-fixture
  namespace: goauthy
  labels:
    app.kubernetes.io/name: upstream-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: upstream-fixture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: upstream-fixture
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fixture
          image: goauthy-upstream-fixture:e2e
          imagePullPolicy: Never
          ports:
            - name: https
              containerPort: 8443
          env:
            - name: ISSUER
              value: https://upstream-fixture.goauthy.svc.cluster.local
            - name: CLIENT_ID
              value: goauthy-upstream-e2e
            - name: CLIENT_SECRET
              value: goauthy-upstream-e2e-secret
            - name: CALLBACK_URI
              value: https://localhost:__E2E_PORT__/upstream/fixture/callback
            - name: GITHUB_CALLBACK_URI
              value: https://localhost:__E2E_PORT__/upstream/github/callback
            - name: UPSTREAM_FIXTURE_TLS_CERT_FILE
              value: /run/upstream-tls/tls.crt
            - name: UPSTREAM_FIXTURE_TLS_KEY_FILE
              value: /run/upstream-tls/tls.key
            - name: ALLOW_TEST_CLAIMS
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          startupProbe:
            tcpSocket:
              port: https
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: upstream-fixture-tls
              mountPath: /run/upstream-tls
              readOnly: true
      volumes:
        - name: upstream-fixture-tls
          secret:
            secretName: upstream-fixture-tls
            defaultMode: 0440
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: upstream-fixture-ingress
  namespace: goauthy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: upstream-fixture
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: goauthy
      ports:
        - protocol: TCP
          port: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: goauthy-upstream-fixture-egress
  namespace: goauthy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: goauthy
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: upstream-fixture
      ports:
        - protocol: TCP
          port: 8443
