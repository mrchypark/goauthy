apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: goauthy-qual-s1-0917
  namespace: ternal-auth
  labels:
    app.kubernetes.io/name: goauthy
    app.kubernetes.io/part-of: goauthy-qual-s1-0917
spec:
  serviceName: goauthy-qual-s1-0917
  podManagementPolicy: Parallel
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: goauthy
      app.kubernetes.io/part-of: goauthy-qual-s1-0917
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goauthy
        app.kubernetes.io/part-of: goauthy-qual-s1-0917
        app.kubernetes.io/component: object-store-client
    spec:
      serviceAccountName: ternal-goauthy
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: goauthy
          image: ghcr.io/mrchypark/ternal@sha256:cf6b1d862e7a6cd6dfa6bc3543aed498d9c0701e6593f8191052d7d4c3bfb6bf
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GOAUTHY_LISTEN_ADDR
              value: ":8080"
            - name: GOAUTHY_ISSUER
              valueFrom:
                configMapKeyRef:
                  name: goauthy-qual-config
                  key: issuer-s1
            - name: GOAUTHY_SIGNING_KEY_ROTATION_PERIOD
              value: 720h
            - name: GOAUTHY_BROWSER_SESSION_IDLE_TIMEOUT
              value: 90m
            - name: GOAUTHY_CLUSTER_ID
              value: goauthy-qual-s1-0917
            - name: GOAUTHY_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: GOAUTHY_DATA_DIR
              value: /var/lib/goauthy
            - name: SQLITE_TMPDIR
              value: /tmp
            - name: GOAUTHY_RHIZA_PROFILE
              value: standalone
            - name: GOAUTHY_RHIZA_REQUIRE_OBJECT_STORE
              value: "true"
            - name: GOAUTHY_RHIZA_OBJECT_STORE_PROVIDER
              value: gcs
            - name: GOAUTHY_RHIZA_OBJECT_STORE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: goauthy-qual-config
                  key: gcs-bucket
            - name: GOAUTHY_RHIZA_OBJECT_STORE_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: goauthy-qual-config
                  key: gcs-prefix-s1
            - name: GOAUTHY_MASTER_KEY_DIR
              value: /run/secrets/master-keys
            - name: GOAUTHY_ACTIVE_MASTER_KEY_ID
              value: qual-s1-0917
            - name: GOAUTHY_OAUTH_HMAC_SECRET_FILE
              value: /run/secrets/oauth-hmac
            - name: GOAUTHY_BOOTSTRAP_CLIENT_SECRET_FILE
              value: /run/secrets/bootstrap-client
            - name: GOAUTHY_BOOTSTRAP_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: goauthy-qual-config
                  key: bootstrap-client-id-s1
            - name: GOAUTHY_BOOTSTRAP_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: goauthy-qual-config
                  key: bootstrap-redirect-uri-s1
            - name: GOAUTHY_BOOTSTRAP_USER
              value: admin
            - name: GOAUTHY_BOOTSTRAP_USER_SUBJECT
              value: qual-s1-bootstrap-admin
            - name: GOAUTHY_BOOTSTRAP_USER_PASSWORD_PHC_FILE
              value: /run/secrets/bootstrap-user-password-phc
            - name: GOAUTHY_BOOTSTRAP_USER_ROLES
              value: '["rauthy_admin"]'
            - name: GOAUTHY_BOOTSTRAP_ALLOWED_RESOURCES
              value: '["https://api.example.test/v1"]'
            - name: GOAUTHY_RFC8252_LOOPBACK_REDIRECTS
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: sqlite-tmp
              mountPath: /tmp
            - name: data
              mountPath: /var/lib/goauthy
            - name: secrets
              mountPath: /run/secrets/master-keys
              subPath: master-keys
              readOnly: true
            - name: secrets
              mountPath: /run/secrets/oauth-hmac
              subPath: oauth-hmac
              readOnly: true
            - name: secrets
              mountPath: /run/secrets/bootstrap-client
              subPath: bootstrap-client
              readOnly: true
            - name: secrets
              mountPath: /run/secrets/bootstrap-user-password-phc
              subPath: bootstrap-user-password-phc
              readOnly: true
      volumes:
        - name: secrets
          secret:
            secretName: goauthy-qual-s1-secrets
            defaultMode: 288
            items:
              - key: qual-s1-0917
                path: master-keys/qual-s1-0917
              - key: oauth-hmac
                path: oauth-hmac
              - key: bootstrap-client
                path: bootstrap-client
              - key: bootstrap-user-password-phc
                path: bootstrap-user-password-phc
        - name: sqlite-tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: data
          emptyDir:
            sizeLimit: 1Gi
