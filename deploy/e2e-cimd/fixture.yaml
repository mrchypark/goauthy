apiVersion: v1
kind: Service
metadata:
  name: goauthy-cimd-fixture
  namespace: goauthy
  labels:
    app.kubernetes.io/name: goauthy-cimd-fixture
    app.kubernetes.io/component: e2e-cimd-fixture
spec:
  selector:
    app.kubernetes.io/name: goauthy-cimd-fixture
  externalIPs:
    # A genuine public-unicast destination. kind kube-proxy DNATs it only in
    # this disposable cluster; GoAuthy still rejects private/special-use IPs.
    - 8.8.8.8
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goauthy-cimd-fixture
  namespace: goauthy
  labels:
    app.kubernetes.io/name: goauthy-cimd-fixture
    app.kubernetes.io/component: e2e-cimd-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: goauthy-cimd-fixture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goauthy-cimd-fixture
        app.kubernetes.io/component: e2e-cimd-fixture
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fixture
          image: goauthy-cimd-fixture:e2e
          imagePullPolicy: Never
          ports:
            - name: https
              containerPort: 8443
          env:
            - name: CIMD_FIXTURE_TLS_CERT_FILE
              value: /run/cimd-tls/tls.crt
            - name: CIMD_FIXTURE_TLS_KEY_FILE
              value: /run/cimd-tls/tls.key
            - name: CIMD_FIXTURE_CLIENT_ID
              value: https://cimd.e2e.test/good
            - name: CIMD_FIXTURE_REDIRECT_URI
              value: https://cimd.e2e.test/callback
            - name: CIMD_FIXTURE_PRIVATE_REDIRECT_URL
              value: https://127.0.0.1/sentinel
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 2
          volumeMounts:
            - name: cimd-fixture-tls
              mountPath: /run/cimd-tls
              readOnly: true
      volumes:
        - name: cimd-fixture-tls
          secret:
            secretName: cimd-fixture-tls
            defaultMode: 0440
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: goauthy-cimd-fixture
  namespace: goauthy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: goauthy-cimd-fixture
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: goauthy
      ports:
        - protocol: TCP
          port: 8443
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: goauthy-cimd-egress
  namespace: goauthy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: goauthy
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 8.8.8.8/32
      ports:
        - protocol: TCP
          port: 443
