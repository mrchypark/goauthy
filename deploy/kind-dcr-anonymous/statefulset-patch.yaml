apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: goauthy
  namespace: goauthy
spec:
  template:
    spec:
      containers:
        - name: goauthy
          env:
            - name: GOAUTHY_DCR_REGISTRATION_TOKEN_FILE
              $patch: delete
            - name: GOAUTHY_ISSUER
              value: http://127.0.0.1:__E2E_PORT__
            - name: GOAUTHY_DCR_ANONYMOUS
              value: "true"
            - name: GOAUTHY_DCR_RATE_LIMIT_SECONDS
              value: "3600"
            - name: GOAUTHY_DCR_ANONYMOUS_CLEANUP_MINUTES
              value: "1"
            - name: GOAUTHY_TRUSTED_PROXIES
              value: 0.0.0.0/0
