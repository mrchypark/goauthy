apiVersion: v1
kind: Service
metadata:
  name: goauthy-scim-fixture
  namespace: goauthy
  labels:
    app.kubernetes.io/name: goauthy-scim-fixture
    app.kubernetes.io/component: e2e-scim-fixture
spec:
  selector:
    app.kubernetes.io/name: goauthy-scim-fixture
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: goauthy-scim-fixture
  namespace: goauthy
  labels:
    app.kubernetes.io/name: goauthy-scim-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: goauthy-scim-fixture
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goauthy-scim-fixture
        app.kubernetes.io/component: e2e-scim-fixture
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fixture
          image: goauthy-scim-fixture:e2e
          imagePullPolicy: Never
          ports:
            - name: https
              containerPort: 8444
          env:
            - name: SCIM_FIXTURE_TLS_CERT_FILE
              value: /run/scim-fixture-tls/tls.crt
            - name: SCIM_FIXTURE_TLS_KEY_FILE
              value: /run/scim-fixture-tls/tls.key
            - name: SCIM_FIXTURE_ADMIN_ADDR
              value: 127.0.0.1:8083
            - name: SCIM_FIXTURE_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: goauthy-scim-provider-token
                  key: fixture-token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          startupProbe:
            tcpSocket:
              port: https
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: https
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: https
            periodSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: scim-fixture-tls
              mountPath: /run/scim-fixture-tls
              readOnly: true
      volumes:
        - name: scim-fixture-tls
          secret:
            secretName: goauthy-scim-fixture-tls
            defaultMode: 0440
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: goauthy-scim-fixture
  namespace: goauthy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: goauthy-scim-fixture
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: goauthy
      ports:
        - protocol: TCP
          port: 8444
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: goauthy-scim-fixture-egress
  namespace: goauthy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: goauthy
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: goauthy-scim-fixture
      ports:
        - protocol: TCP
          port: 8444
