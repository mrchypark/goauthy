name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  storage-compatibility:
    name: Storage SDK providers & Local upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        name: Setup Go
        with:
          go-version-file: go.mod

      - name: Check storage fixture shell syntax
        run: |
          sh -n scripts/test-object-store-contract.sh
          sh -n scripts/test-rhiza-local-upgrade.sh

      # Actual SDK adapters and archive recovery on all three providers.
      # Azure is a generic SDK contract, not GoAuthy runtime provider support.
      - name: Prepare compiler process supervisor
        timeout-minutes: 5
        run: sh scripts/e2e-stage-supervisor.sh --prepare

      - name: Isolated S3 GCS Azure SDK contracts
        timeout-minutes: 55
        run: sh scripts/test-object-store-contract.sh

      # Synthetic filesystem archive proof; does not qualify app init on clouds.
      - name: Local archive v0.21.2 to v0.23.0 compatibility
        timeout-minutes: 20
        run: sh scripts/test-rhiza-local-upgrade.sh

      - name: Upload SDK contract receipts
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: storage-sdk-contracts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/goauthy-object-contract-logs.*
          if-no-files-found: warn

  browser-login-journey:
    name: Browser login journey
    runs-on: ubuntu-latest
    # Three serial fixtures: login tests cap at 4m, registration at seven 3m
    # Go-test invocations, with 10m reserved for builds, startup, and cleanup.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        name: Setup Go
        with:
          go-version-file: go.mod

      - name: Require preinstalled Chrome
        run: |
          chrome=$(command -v google-chrome || command -v google-chrome-stable || true)
          [ -n "$chrome" ] || { echo "preinstalled Google Chrome is required for the browser login journey" >&2; exit 1; }
          "$chrome" --version
          echo "GOAUTHY_E2E_CHROME_BIN=$chrome" >> "$GITHUB_ENV"

      - name: Check login journey preflight guards
        run: sh scripts/test-e2e-login-journey-standalone.sh

      - name: Check isolated project journey guards
        run: sh scripts/test-verify-isolated.sh

      - name: Run isolated project journeys
        env:
          GOAUTHY_ISOLATED_E2E_SLOT: granted
        run: sh scripts/verify-isolated.sh --run

      - name: Upload sanitized browser failure artifact
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: browser-login-journey-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/goauthy-login-journey-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn

  manifests:
    name: Manifest checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout

      - name: Install kustomize and yq
        run: |
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar -xz -C /usr/local/bin kustomize
          curl -sSfL "https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64" -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      # The qualification base manifests and the standalone overlay are parsed
      # and rendered here because a duplicate YAML key or a dropped pod-template
      # label silently changes the deployed resources.
      - name: deploy/standalone
        run: ./deploy/standalone/test.sh

      - name: deploy/standalone-local
        run: sh ./deploy/standalone-local/test.sh

      - name: deploy/ied-qualification
        run: ./deploy/ied-qualification/test.sh

      # Cheap offline oracle checks for the issue #113 isolation summarizer,
      # its CI report aggregation, and the production image-binding controls.
      # They never provision Kind, build images, dispatch, or run a campaign.
      - name: Offline isolation summarizer oracle tests
        run: |
          command -v jq >/dev/null 2>&1 || { echo "jq is required for the offline oracle tests" >&2; exit 1; }
          ./scripts/test-e2e-kind-saas-isolation-113-summarize.sh
          ./scripts/test-run-capacity-113-ci-summarize.sh
          ./scripts/test-e2e-kind-saas-isolation-provenance.sh
          ./scripts/test-capacity-113-oci-archive-identity.sh

  vet-session-policy:
    name: Vet & session-policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        name: Setup Go
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet -p=3 ./...

      - name: session-policy
        run: make test-e2e-session-policy

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        name: Setup Go
        with:
          go-version-file: go.mod

      - name: Internal JavaScript tests
        run: |
          command -v node >/dev/null 2>&1 || { echo "node is required for internal JavaScript tests" >&2; exit 1; }
          find internal -type d -name vendor -prune -o -type f \( -name '*_test.js' -o -name '*_test.cjs' -o -name '*.test.js' -o -name '*.test.cjs' \) -print \
            | LC_ALL=C sort \
            | while IFS= read -r test_file; do
                echo "Running $test_file"
                node "$test_file" || exit 1
              done

      - name: test
        run: go test -timeout=60m -p 3 ./...

  tests-race:
    name: Race tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        name: Setup Go
        with:
          go-version-file: go.mod

      - name: test -race
        run: go test -race -timeout=90m -p 3 ./...
        # Known passing race suite (OAuth) takes ~56m; 60m timeout has too little headroom.

      - name: Registered refresh shutdown integration -race
        run: go test -race -tags=goauthy_integration ./cmd/goauthy -run '^TestRuntimeShutdownRegisteredRefresh$' -count=1 -timeout=120s
