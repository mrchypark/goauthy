name: CI

on:
  push:
    branches: [main, feature/rauthy-go-port]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vet-session-policy:
    name: Vet & session-policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        name: Setup Go
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet -p=3 ./...

      - name: session-policy
        run: make test-e2e-session-policy

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        name: Setup Go
        with:
          go-version-file: go.mod

      - name: test
        run: go test -timeout=60m -p 3 ./...

  tests-race:
    name: Race tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: Checkout

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        name: Setup Go
        with:
          go-version-file: go.mod

      - name: test -race
        run: go test -race -timeout=60m -p 3 ./...

