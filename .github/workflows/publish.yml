name: Publish container

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag to publish (optional, e.g. v0.1.0)'
        required: false
        type: string

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mrchypark/goauthy

jobs:
  publish:
    name: Publish container image
    permissions:
      contents: read
      actions: read
      packages: write
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        ||
        github.event_name == 'push' && github.ref_type == 'tag'
        ||
        github.event_name == 'workflow_run'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Resolve source SHA
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            sha="$WORKFLOW_RUN_HEAD_SHA"
          else
            sha="$SOURCE_EVENT_SHA"
          fi

          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Invalid source SHA: $sha"
            exit 1
          fi

          current=$(gh api "repos/$REPOSITORY/git/refs/heads/main" --jq '.object.sha')
          if [ "$current" != "$sha" ]; then
            echo "::error::main HEAD mismatch: source=$sha main=$current"
            exit 1
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ -z "$RELEASE_TAG" ] && [ "$EVENT_NAME" = "workflow_run" ]; then
            RELEASE_TAG=$(gh api "repos/$REPOSITORY/tags?per_page=100" --jq "[.[] | select(.commit.sha == \"$sha\" and (.name | test(\"^v(0|[1-9][0-9]*)\\\\.(0|[1-9][0-9]*)\\\\.(0|[1-9][0-9]*)$\")))] | .[0].name // \"\"")
          fi
          tags="$IMAGE:latest,$IMAGE:sha-$sha"
          if [ -n "$RELEASE_TAG" ]; then
            if ! [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Release tag must be vMAJOR.MINOR.PATCH"
              exit 1
            fi
            tag_sha=$(gh api "repos/$REPOSITORY/commits/$RELEASE_TAG" --jq '.sha')
            if [ "$tag_sha" != "$sha" ]; then
              echo "::error::Release tag does not point at the verified source SHA"
              exit 1
            fi
            tags="$tags,$IMAGE:$RELEASE_TAG"
            goauthy_version="${RELEASE_TAG#v}"
          else
            goauthy_version="sha-${sha:0:12}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "goauthy_version=$goauthy_version" >> "$GITHUB_OUTPUT"

      - name: Verify CI succeeded for source SHA
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 5400))
          while true; do
            runs_json=$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&head_sha=$SOURCE_SHA&per_page=100")
            success=$(printf '%s' "$runs_json" | jq --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success" and .status == "completed")] | length')
            if [ "$success" -ge 1 ]; then
              echo "Verified $success successful CI run(s) for $SOURCE_SHA"
              exit 0
            fi
            active=$(printf '%s' "$runs_json" | jq --arg sha "$SOURCE_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push" and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending"))] | length')
            if [ "$active" -lt 1 ]; then
              echo "::error::No successful CI push run found for SHA $SOURCE_SHA on main"
              exit 1
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for CI push run for SHA $SOURCE_SHA on main"
              exit 1
            fi
            echo "Waiting 30s for $active active CI push run(s) on main for $SOURCE_SHA..."
            sleep 30
          done

      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build linux/amd64 image for scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:sha-${{ steps.source.outputs.sha }}
          build-args: |
            GOAUTHY_VERSION=${{ steps.source.outputs.goauthy_version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Grype
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2
        with:
          image: ${{ env.IMAGE }}:sha-${{ steps.source.outputs.sha }}
          severity-cutoff: high
          fail-build: true
          only-fixed: false
          output-format: table
          grype-version: 'v0.118.0'

      - name: Verify main HEAD before push
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$REPOSITORY/git/refs/heads/main" --jq '.object.sha')
          if [ "$current" != "$SOURCE_SHA" ]; then
            echo "::error::main HEAD changed: expected $SOURCE_SHA, got $current"
            exit 1
          fi
          echo "main HEAD still at $SOURCE_SHA"

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push multi-arch image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.source.outputs.tags }}
          build-args: |
            GOAUTHY_VERSION=${{ steps.source.outputs.goauthy_version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print digest summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          RELEASE_TAG: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$DIGEST" != sha256:* ]]; then
            echo "::error::Unexpected digest format: $DIGEST"
            exit 1
          fi
          {
            echo "## Published container (linux/amd64, linux/arm64)"
            echo ""
            echo "| Tag | Digest |"
            echo "|-----|--------|"
            echo "| \`latest\` | \`${DIGEST}\` |"
            echo "| \`sha-${SOURCE_SHA}\` | \`${DIGEST}\` |"
            if [ -n "$RELEASE_TAG" ]; then
              echo "| \`${RELEASE_TAG}\` | \`${DIGEST}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
